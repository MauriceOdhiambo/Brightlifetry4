    <div class="main-wrapper" id="mainWrapper">
        
            <div class="auth-container" id="app" style="display:block;">
            <div class="auth-back-row app-install-row"><span></span><button type="button" class="auth-back-btn" id="installAppButton" style="display:none"><i class="fas fa-download"></i><span>Install App</span></button></div>
            <div class="auth-logo">
                <div class="icon"><img src="/favicon.png" alt="Brightlife CBO"></div>
                <h1>Brightlife <span>CBO</span></h1>
                <p>Member &amp; Administration Portal</p>
            </div>

            <div class="tab-buttons">
                <button class="tab-btn active" onclick="showTab('login')">Sign In</button>
                <button class="tab-btn" onclick="showTab('register')">Register</button>
            </div>

            
            <div id="loginTab" class="tab-content active">
                <div id="loginMessage"></div>
                <form id="loginForm" onsubmit="loginUser(event)">
                    <div class="form-group">
                        <label>ID Number</label>
                        <div class="input-wrapper">
                            <i class="fas fa-id-card"></i>
                            <input type="text" id="loginId" placeholder="Enter your ID number" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="loginPassword" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('loginPassword')" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--gray-400); cursor:pointer;">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-arrow-right"></i> Sign In
                    </button>
                </form>
                <div class="auth-links">
                    <button type="button" class="auth-forgot-btn" onclick="showTab('reset'); return false;">Forgot Password?</button>
                </div>
            </div>

            
            <div id="registerTab" class="tab-content">
                <div class="registration-layout">
                <div class="registration-form-panel">
                <div id="registerMessage"></div>
                <form id="registerForm" onsubmit="registerUser(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="regName" placeholder="John Doe" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>ID Number</label>
                        <div class="input-wrapper">
                            <i class="fas fa-id-card"></i>
                            <input type="text" id="regId" placeholder="12345678" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <div class="input-wrapper">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="regPhone" placeholder="0712345678" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email <span style="color:var(--danger,#dc2626);">*</span></label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="regEmail" placeholder="john@example.com" required autocomplete="email">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="regPassword" placeholder="Create password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('regPassword')" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--gray-400); cursor:pointer;">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-check-circle"></i>
                            <input type="password" id="regConfirmPassword" placeholder="Confirm password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('regConfirmPassword')" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--gray-400); cursor:pointer;">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </form>
                </div>

                </div>
            </div>

            <div id="resetTab" class="tab-content">
                <div id="resetMessage"></div>
                <form id="resetForm" onsubmit="resetPasswordFunc(event)">
                    <div class="form-group"><label>ID Number</label><div class="input-wrapper"><i class="fas fa-id-card"></i><input type="text" id="resetId" required></div></div>
                    <div class="form-group"><label>Registered Email</label><div class="input-wrapper"><i class="fas fa-envelope"></i><input type="email" id="resetEmail" required></div></div>
                    <button type="button" id="sendResetOtpBtn" class="btn-outline" onclick="requestResetOtp()"><i class="fas fa-paper-plane"></i> Send OTP</button>
                    <div class="form-group"><label>6-Digit OTP</label><div class="input-wrapper"><i class="fas fa-shield-alt"></i><input type="text" id="resetOtp" inputmode="numeric" maxlength="6"></div></div>
                    <div class="form-group"><label>New Password</label><div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="resetNewPassword" minlength="8" required></div></div>
                    <div class="form-group"><label>Confirm Password</label><div class="input-wrapper"><i class="fas fa-check-circle"></i><input type="password" id="resetConfirmPassword" minlength="8" required></div></div>
                    <button type="submit" class="btn-primary"><i class="fas fa-key"></i> Reset Password</button>
                    <button type="button" class="btn-outline" onclick="showTab('login')" style="margin-top:10px;"><i class="fas fa-arrow-left"></i> Back to Sign In</button>
                </form>
            </div>

            
        </div>

        
        <div class="dashboard-container" id="dashboard" style="display: none;">
            <div class="member-topbar" id="memberTopbar">
                <div class="member-topbar-left">
                    <button class="workspace-mobile-menu-btn" id="workspaceMobileMenuBtn" type="button" onclick="toggleMobileSidebar()" aria-label="Open workspace menu" aria-expanded="false">
                        <i class="fas fa-bars" aria-hidden="true"></i>
                    </button>
                    <div class="member-page-title" id="memberTopbarTitle">Dashboard</div>
                </div>
                <div class="member-topbar-actions">
                    <button class="topbar-icon-btn" type="button" title="Messages" onclick="navigateTo('messages')">
                        <i class="fas fa-envelope"></i><span class="topbar-badge" id="topMessageBadge" style="display:none;">0</span>
                    </button>
                    <div class="account-wrap" id="accountMenuWrap">
                        <button class="account-trigger" type="button" onclick="toggleAccountMenu(event)" aria-haspopup="true" aria-expanded="false">
                            <span class="account-avatar" id="topAccountAvatar">G</span>
                            <span class="account-trigger-text"><span class="account-trigger-name" id="topAccountName">Member</span><span class="account-trigger-role" id="topAccountRole">Member</span></span>
                            <i class="fas fa-chevron-down account-chevron"></i>
                        </button>
                        <div class="account-menu" id="accountMenu" role="menu">
                            <div class="account-menu-label">My Account</div>
                            <button type="button" onclick="closeAccountMenu();navigateTo('profile')"><i class="fas fa-user"></i> Profile</button>
                            <button type="button" onclick="closeAccountMenu();navigateTo('settings')"><i class="fas fa-gear"></i> Settings</button>
                            <button type="button" class="danger" onclick="closeAccountMenu();confirmLogout()"><i class="fas fa-right-from-bracket"></i> Logout</button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="dashboardContent"></div>
        </div>
    </div>
<script src="/assets/app.js?v=20261117-2" defer></script>
